name: Windows build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build portable app and installer
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Publish self-contained Windows x64 app
        shell: pwsh
        run: dotnet publish src/ScrollVideoPlayer/ScrollVideoPlayer.csproj -c Release -r win-x64 --self-contained true -p:PublishReadyToRun=true -o dist/ScrollVideoPlayer

      - name: Package portable ZIP
        shell: pwsh
        run: Compress-Archive -Path "dist/ScrollVideoPlayer/*" -DestinationPath "dist/ScrollVideoPlayer-Portable-win-x64.zip" -Force

      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress

      - name: Build Windows installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "dist/installer" | Out-Null
          $compiler = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $compiler)) { throw "Inno Setup compiler was not found." }
          Push-Location "installer"
          try {
            & $compiler "ScrollVideoPlayer.iss"
            if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed with exit code $LASTEXITCODE" }
          } finally {
            Pop-Location
          }

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ScrollVideoPlayer-Windows-x64
          path: |
            dist/ScrollVideoPlayer-Portable-win-x64.zip
            dist/installer/ScrollVideoPlayer-Setup.exe
          if-no-files-found: error
          retention-days: 30

      - name: Attach packages to GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/ScrollVideoPlayer-Portable-win-x64.zip
            dist/installer/ScrollVideoPlayer-Setup.exe
          generate_release_notes: true
